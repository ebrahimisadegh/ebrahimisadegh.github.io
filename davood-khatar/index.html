<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Davood Khatar · داوود خطر</title>
  <meta name="description" content="Davood Khatar: a Dangerous Dave tribute set at landmarks across Iran. Play in your browser.">
  <meta name="author" content="Sadegh Ebrahimi">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c1640">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Vazirmatn:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="s.css">
</head>
<body>
  <main id="stage">
    <canvas id="game" aria-label="Davood Khatar game"></canvas>
  </main>

  <div id="touch" aria-hidden="true">
    <div class="pad">
      <button data-key="left">◀</button>
      <button data-key="right">▶</button>
      <button data-key="down">▼</button>
    </div>
    <button class="start" data-key="start">START</button>
    <button class="fire" data-key="carpet">🧞</button>
    <button class="fire" data-key="fire">🗡</button>
    <button class="jump" data-key="jump">▲</button>
  </div>
  <script src="g.js"></script>
</body>
</html>
